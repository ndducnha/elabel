<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e-Label Verification</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;color:#111827}
    .wrap{max-width:720px;margin:40px auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
    .badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#ecfdf5;color:#047857;font-weight:700}
    .status{margin-top:20px;padding:18px;border-radius:14px;font-size:22px;font-weight:700;text-align:center}
    .loading{background:#fff7ed;color:#c2410c}.success{background:#ecfdf5;color:#047857}.fail{background:#fef2f2;color:#b91c1c}
    .grid{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:22px;font-size:15px}
    .label{color:#6b7280}.value{font-weight:600;word-break:break-word}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">HỆ THỐNG NHÃN ĐIỆN TỬ</div>
    <h1 id="productName">Sữa Vina Export</h1>
    <p>Mã định danh: <b id="productIdText">8938500000271</b></p>

    <div id="status" class="status loading">Đang xác thực...</div>

    <div class="grid" id="productInfoBox"></div>
  </div>

  <script>
    /*
      CONFIG:
      1. Đẩy file này lên GitHub Pages.
      2. Sửa API_BASE thành domain backend của anh.
      3. QR link mẫu:
         https://USERNAME.github.io/REPO/verify.html?id=8938500000271&token=abc123
    */

    const API_BASE = "https://YOUR-BACKEND-DOMAIN.com";
    const VERIFY_API_URL = API_BASE + "/api/verify";

    /*
      Product info có thể hardcode, hoặc backend trả về theo id.
      Demo này dùng thông tin giống file e-label anh gửi.
    */
    const PRODUCT_INFO = {
      productName: "Sữa Vina Export",
      productId: "8938500000271",
      category: "Thực phẩm",
      riskLevel: "Hàng hóa rủi ro thấp",
      responsibleCompany: "Công ty Cổ phần Sữa Vina",
      responsibleAddress: "88 Đại lộ Sữa, Quận 1, TP.HCM",
      origin: "Vietnam",
      brand: "—",
      supplier: "—",
      targetMarket: "—",
      description: "—",
      quantity: "330 kcal",
      ingredients: "Sugar (45%), full-cream milk powder (28%), vegetable oil (10%), water.",
      warning: "Cool, dry place. Refrigerate after opening.",
      usage: "Coffee, baking, desserts. Once opened, use within 5 days.",
      storage: "Cool, dry place. Refrigerate after opening."
    };

    function qp(name) {
      return new URL(location.href).searchParams.get(name);
    }

    function renderProductInfo() {
      document.getElementById("productName").textContent = PRODUCT_INFO.productName;
      document.getElementById("productIdText").textContent = qp("id") || PRODUCT_INFO.productId;

      const rows = [
        ["Tên sản phẩm", PRODUCT_INFO.productName],
        ["Mã định danh", qp("id") || PRODUCT_INFO.productId],
        ["Doanh nghiệp", PRODUCT_INFO.responsibleCompany],
        ["Địa chỉ", PRODUCT_INFO.responsibleAddress],
        ["Xuất xứ", PRODUCT_INFO.origin],
        ["Phân loại", PRODUCT_INFO.category],
        ["Mức rủi ro", PRODUCT_INFO.riskLevel],
        ["Định lượng", PRODUCT_INFO.quantity],
        ["Thành phần", PRODUCT_INFO.ingredients],
        ["Cảnh báo", PRODUCT_INFO.warning],
        ["Hướng dẫn sử dụng", PRODUCT_INFO.usage],
        ["Bảo quản", PRODUCT_INFO.storage]
      ];

      document.getElementById("productInfoBox").innerHTML = rows.map(([k,v]) => `
        <div class="label">${escapeHtml(k)}</div>
        <div class="value">${escapeHtml(v)}</div>
      `).join("");
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function collectVisitorInfo() {
      const ua = navigator.userAgent || "";
      const visitorRaw = [
        ua,
        navigator.language,
        navigator.platform,
        screen.width,
        screen.height,
        Intl.DateTimeFormat().resolvedOptions().timeZone
      ].join("|");

      return {
        page: {
          url: location.href,
          referrer: document.referrer,
          title: document.title,
          path: location.pathname,
          query: location.search
        },
        browser: {
          userAgent: ua,
          language: navigator.language,
          languages: navigator.languages,
          platform: navigator.platform,
          vendor: navigator.vendor,
          cookieEnabled: navigator.cookieEnabled,
          doNotTrack: navigator.doNotTrack,
          online: navigator.onLine
        },
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
          pixelRatio: window.devicePixelRatio,
          viewportWidth: innerWidth,
          viewportHeight: innerHeight
        },
        time: {
          clientTime: new Date().toISOString(),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          timezoneOffset: new Date().getTimezoneOffset()
        },
        visitorFingerprint: await sha256(visitorRaw)
      };
    }

    async function verify() {
      renderProductInfo();

      const payload = {
        productId: qp("id") || PRODUCT_INFO.productId,
        token: qp("token") || "",
        productInfo: PRODUCT_INFO,
        visitorInfo: await collectVisitorInfo()
      };

      try {
        const res = await fetch(VERIFY_API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        const status = document.getElementById("status");
        if (data.verified === true) {
          status.className = "status success";
          status.textContent = "✅ Verify thành công";
        } else {
          status.className = "status fail";
          status.textContent = "❌ Verify thất bại";
        }
      } catch (e) {
        const status = document.getElementById("status");
        status.className = "status fail";
        status.textContent = "⚠️ Không kết nối được server xác thực";
      }
    }

    verify();
  </script>
</body>
</html>
